<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼娘 · 48 帧动作预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#233b60;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1080px;margin:auto;padding:32px}h1{font-size:26px;margin:0 0 10px}p{color:#687c9b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{border:1px solid #dce6f5;border-radius:20px;background:#fff;padding:18px}h2{margin:0;font-size:17px}.pair{display:flex;justify-content:space-around;margin-top:12px;gap:8px}.sprite{width:138px;height:138px;background-size:400% 200%;background-repeat:no-repeat}small{display:block;text-align:center;color:#7484a0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{border:1px solid #d6e2f6;border-radius:10px;background:white;padding:9px 14px;color:#315caa;cursor:pointer}a{color:#4267ce}footer{margin-top:20px;color:#7484a0;font-size:12px}
</style><main><h1>鲸鱼娘 · 六种情景逐帧动画</h1><p>每种情景两组动作，每组四张独立绘制的动作帧，共 48 帧。下面两列同时播放动作 A 和 B，方便检查表情、手臂、尾巴和道具变化。</p><div class="toolbar"><button id="play">暂停播放</button><button id="step">下一帧</button><label>速度 <select id="speed"><option value="1">正常</option><option value="2">慢速 × 0.5</option><option value="0.5">快速 × 2</option></select></label><span id="frame">第 1 / 4 帧</span></div><div class="grid" id="grid"></div><footer>透明 PNG 原图与完整生成提示词保存在本插件 assets/ 和 FRAME-PROMPTS.json 中。此页仅预览本地绘制素材，不查询账户余额。</footer></main><script>
const states=[['idle','待机','抱碗眨眼 / 舀饭吃饭',320],['working','工作中','写写画画 / 思考灵感',260],['done','完成待查看','挥手提醒 / 竖拇指',260],['low','余额不足','抱空碗哀求 / 递碗讨饭',400],['dragged','被拖动','伸手平衡 / 抱碗蜷腿',220],['clicked','被点击','惊讶微笑 / 贴脸招手',240]];
for(const[key,label,description]of states){const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${label}</h2><p>${description}</p><div class="pair">${[0,1].map(row=>`<div><div class="sprite" data-phase="${key}" data-row="${row}" style="background-image:url(assets/whalechan-${key}-sheet.png);background-position:0% ${row*100}%"></div><small>动作 ${row?'B':'A'} · 四帧</small></div>`).join('')}</div><p><a href="assets/whalechan-${key}-sheet.png" target="_blank">查看八帧原图</a></p>`;document.querySelector('#grid').append(card);}
let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now(),elapsed={};
function draw(sprite,n){sprite.style.backgroundPosition=`${n*100/3}% ${sprite.dataset.row*100}%`;}
function render(now){const dt=now-last;last=now;if(playing&&!document.hidden){for(const[key,,,ms]of states){elapsed[key]=(elapsed[key]||0)+dt;const n=Math.floor(elapsed[key]/(ms*Number(document.querySelector('#speed').value)))%4;document.querySelectorAll(`[data-phase="${key}"]`).forEach(el=>draw(el,n));}document.querySelector('#frame').textContent='逐帧播放中';}requestAnimationFrame(render);}requestAnimationFrame(render);
function showPlay(){document.querySelector('#play').textContent=playing?'暂停播放':'继续播放';}showPlay();document.querySelector('#play').onclick=()=>{playing=!playing;showPlay();};document.querySelector('#step').onclick=()=>{playing=false;showPlay();frame=(frame+1)%4;document.querySelectorAll('.sprite').forEach(el=>draw(el,frame));document.querySelector('#frame').textContent=`第 ${frame+1} / 4 帧`;};
</script></html>
